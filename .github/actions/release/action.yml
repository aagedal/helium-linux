name: Publish Helium Neo release assets
description: Upload Linux packages to the Helium Neo release and update the Homebrew cask

inputs:
  tag:
    description: "aagedal/helium release tag"
    required: true
  token:
    description: "Token with contents write access to aagedal/helium and aagedal/homebrew-tap"
    required: true

runs:
  using: composite
  steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: helium-neo-linux-*
        path: ./release/
        merge-multiple: true

    - name: Upload to release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        ls -la release/
        gh release upload "$TAG" -R aagedal/helium --clobber release/*

    - name: Update Homebrew cask
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ inputs.tag }}
      run: bash ./.github/scripts/update-cask.sh "$TAG" release
