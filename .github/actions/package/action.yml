name: Package Helium Neo
description: Package Helium Neo as tar.xz and AppImage, upload artifacts

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3

    - name: Download build cache
      uses: actions/download-artifact@v4
      with:
        name: build-cache-${{ env.ARCH }}
        path: .github/cache/

    - name: Import build cache
      shell: bash
      run: bash ./.github/scripts/import-cache.sh

    - name: Package with Docker
      shell: bash
      run: bash ./package/docker-package.sh

    - name: List build artifacts
      shell: bash
      run: ls -la build/release

    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: helium-neo-linux-${{ env.ARCH }}
        path: |
          build/release/Helium-Neo-*.tar.xz
          build/release/Helium-Neo-*.AppImage
        if-no-files-found: error
        compression-level: 0
